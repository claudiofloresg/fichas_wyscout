# Actualiza la página leyendo directo de Google Drive (sin actualizar.bat).
# Solo corre cuando alguien lo pide: botón "Publicar fichas" de la página (vía Apps Script),
# menú Fichas -> Publicar de la hoja lista_fichas, o GitHub -> Actions -> "Actualizar fichas" -> Run workflow.
name: Actualizar fichas

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-fichas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Bajar data_fichas de Google Drive (Varonil y Femenil)
        env:
          GDRIVE_KEY: ${{ secrets.GDRIVE_KEY }}
          BASE_FILE_ID: ${{ vars.BASE_FILE_ID }}
        run: |
          printf '%s' "$GDRIVE_KEY" > gdrive_key.json
          python descargar_drive.py
          rm -f gdrive_key.json

      - name: Generar la página (Varonil)
        run: python build.py

      # Temporadas anteriores de Varonil en <página>/25-26/, <página>/24-25/… Si una falla, se publica lo demás.
      - name: Generar temporadas anteriores (Varonil)
        continue-on-error: true
        run: python build.py --temporadas

      # Sección Femenil en <página>/femenil/. Si falla, se publica lo demás igual.
      - name: Generar Femenil
        continue-on-error: true
        run: python build.py --femenil

      # Fichas de Pumas en <página>/pumas/. Si falla, se publica lo demás igual.
      - name: Generar fichas de Pumas
        continue-on-error: true
        run: python build.py --pumas --web

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte_build
          path: |
            reporte_build.txt
            reporte_femenil.txt
            reporte_pumas.txt
            reporte_*-*.txt
          if-no-files-found: ignore

      - name: Publicar (solo si cambió algo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # la fecha de "generado" y el ?v= cambian siempre: no cuentan como cambio
          quitar='s/"generado":"[^"]*"//'
          igual() { [ "$(git show HEAD:"$1" 2>/dev/null | sed "$quitar")" = "$(sed "$quitar" "$1" 2>/dev/null)" ]; }
          sin_cambios=1
          git diff --cached --quiet -- . ':(exclude)docs/index.html' ':(exclude)docs/data/fichas.js' \
            ':(exclude)docs/*/data/fichas.js' || sin_cambios=0
          for f in docs/data/fichas.js docs/*/data/fichas.js; do
            if [ -f "$f" ] && ! igual "$f"; then sin_cambios=0; fi
          done
          if [ "$sin_cambios" = 1 ]; then
            echo "Sin cambios en los datos; no se publica."
            exit 0
          fi
          git commit -m "Actualización automática desde Drive $(date '+%d/%m/%Y %H:%M')"
          git pull --rebase -X theirs
          git push
